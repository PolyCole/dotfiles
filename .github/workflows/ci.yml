name: CI

on:
  push:
    branches: [main, factory-aurora]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/dots/go.mod

      - name: Build binaries
        run: make all

      - name: Go vet and tests
        run: make test

      - name: zsh syntax check
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zsh
          shopt -s nullglob
          fail=0
          for f in zshrc shell/*.zsh modules/*.zsh machines/*/*.zsh machines/*/modules/*.zsh hooks/runner.zsh; do
            zsh -n "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          exit $fail

      - name: dots doctor
        run: DOTFILES=$PWD ./bin/dots doctor
