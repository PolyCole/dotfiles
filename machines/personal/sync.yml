# sync.yml - personal machine (hostname: six)
# Managed by dots sync subsystem. See tools/dots/ for implementation.

configs:
  - source: machines/personal/gitconfig
    target: ~/.gitconfig

  - source: zshrc
    target: ~/.zshrc

  - source: machines/personal/ssh_config
    target: ~/.ssh/config

snapshots:
  - command: brew bundle dump --force --file=-
    dest: machines/personal/Brewfile

  - command: python -m pip list
    dest: machines/personal/python_packages
